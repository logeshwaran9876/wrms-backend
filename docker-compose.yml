name: wrms-backend

services:
  wrms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: wrms-backend:latest
    container_name: wrms-backend-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
