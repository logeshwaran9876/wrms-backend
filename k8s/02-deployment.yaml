apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrms-backend
  namespace: wrms
  labels:
    app: wrms-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: wrms-backend

  template:
    metadata:
      labels:
        app: wrms-backend

    spec:
      imagePullSecrets:
        - name: dockerauth

      containers:
        - name: wrms-backend
          image: tangentcloud.azurecr.io/wrms-backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"

          envFrom:
            - secretRef:
                name: wrms-backend-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
