name: Deploy WRMS Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wrms-backend-production-deployment
  cancel-in-progress: false

env:
  NAMESPACE: wrms
  DEPLOYMENT: wrms-backend
  CONTAINER: wrms-backend
  IMAGE_NAME: wrms-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Create a unique image tag from commit SHA
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      # 3. Log in to the container registry
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 4. Build and push Docker image
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ vars.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

      # 5. Configure kubectl
      - name: Configure Kubernetes
        env:
          DO_KUBE_CONFIG: ${{ secrets.DO_KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$DO_KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context
          kubectl cluster-info

      # 6. Create namespace if needed
      - name: Create Namespace
        run: |
          kubectl apply -f k8s/01-namespace.yaml

      # 7. Sync registry pull secret & runtime backend secrets
      - name: Sync Kubernetes Secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ vars.CLIENT_URL || '*' }}
          TLS_CRT: ${{ secrets.TLS_CRT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          kubectl create secret docker-registry dockerauth \
            --namespace "$NAMESPACE" \
            --docker-server="${{ vars.REGISTRY_URL }}" \
            --docker-username="${{ secrets.REGISTRY_USERNAME }}" \
            --docker-password="${{ secrets.REGISTRY_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -z "$MONGODB_URI" ]; then
            echo "Error: MONGODB_URI secret is required in GitHub Secrets." >&2
            exit 1
          fi

          kubectl create secret generic wrms-backend-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=MONGODB_URI="$MONGODB_URI" \
            --from-literal=JWT_SECRET="${JWT_SECRET:-wrms-super-admin-secret-key-2026-auth-token-salt}" \
            --from-literal=CLIENT_URL="$CLIENT_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "$TLS_CRT" ] && [ -n "$TLS_KEY" ]; then
            printf '%s' "$TLS_CRT" | base64 -d > /tmp/tls.crt
            printf '%s' "$TLS_KEY" | base64 -d > /tmp/tls.key
            kubectl create secret tls wrms-tls-secret \
              --namespace "$NAMESPACE" \
              --cert=/tmp/tls.crt \
              --key=/tmp/tls.key \
              --dry-run=client -o yaml | kubectl apply -f -
            rm -f /tmp/tls.crt /tmp/tls.key
          fi

      # 8. Apply Kubernetes manifests
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/02-deployment.yaml
          kubectl apply -f k8s/03-service.yaml
          kubectl apply -f k8s/04-ingress.yaml

      # 9. Deploy the newly built image & verify rollout
      - name: Update Deployment Image
        run: |
          kubectl set image deployment/"$DEPLOYMENT" \
            "$CONTAINER"="${{ vars.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            -n "$NAMESPACE"
          kubectl rollout status deployment/"$DEPLOYMENT" -n "$NAMESPACE" --timeout=120s
